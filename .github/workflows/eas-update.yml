name: Publish EAS Preview Update

on:
  workflow_dispatch:
    inputs:
      message:
        description: Update message
        required: true
        default: Preview update

jobs:
  publish-preview:
    name: Publish to the preview channel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Expo and EAS CLI
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}
          packager: npm

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Publish preview update
        run: eas update --channel preview --message "${{ inputs.message }}" --environment preview --non-interactive
        env:
          EXPO_NO_DOTENV: "1"
          EXPO_PUBLIC_EAS_PROJECT_ID: ${{ vars.EXPO_PUBLIC_EAS_PROJECT_ID }}
